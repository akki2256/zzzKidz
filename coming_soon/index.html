    <style>
      :root {
        --p-black: #000000;
        --p-ink: #0b0b0b;
        --p-white: #ffffff;
        --p-accent: #13ff72;
        --p-accent-hover: #ffffff;
        --p-accent-glow: rgba(19, 255, 114, 0.45);
        --p-accent-soft: rgba(19, 255, 114, 0.14);
        --p-on-accent: #0b0b0b;
        --p-dim: rgba(255, 255, 255, 0.62);
        --p-line: rgba(255, 255, 255, 0.14);
        --p-panel: rgba(120, 120, 120, 0.22);
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        font-family: Manrope, ui-sans-serif, system-ui, sans-serif;
        background: var(--p-black);
        color: var(--p-white);
        line-height: 1.5;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .page {
        position: relative;
        isolation: isolate;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        padding:
          calc(1.75rem + var(--safe-top))
          calc(1.25rem + var(--safe-right))
          calc(1.75rem + var(--safe-bottom))
          calc(1.25rem + var(--safe-left));
      }

      .page::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -2;
        background:
          radial-gradient(ellipse 80% 55% at 50% -10%, rgba(19, 255, 114, 0.16), transparent 55%),
          radial-gradient(ellipse 70% 50% at 50% 110%, rgba(19, 255, 114, 0.08), transparent 50%),
          linear-gradient(180deg, #0b0b0b 0%, #000000 45%, #050505 100%);
      }

      .page::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        opacity: 0.35;
        background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        background-size: 22px 22px;
        mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black 20%, transparent 75%);
        pointer-events: none;
      }

      .shell {
        width: min(100%, 26rem);
        text-align: center;
      }

      .logo-wrap {
        position: relative;
        display: inline-flex;
        margin: 0 auto 1.75rem;
      }

      .logo-wrap::before {
        content: "";
        position: absolute;
        inset: -14%;
        border-radius: 50%;
        background: radial-gradient(circle, var(--p-accent-glow) 0%, transparent 68%);
        opacity: 0.55;
        filter: blur(8px);
        pointer-events: none;
      }

      .logo {
        position: relative;
        display: block;
        width: clamp(11.5rem, 56vw, 16rem);
        height: auto;
        aspect-ratio: 1;
        border-radius: 50%;
        object-fit: cover;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.08),
          0 22px 56px rgba(0, 0, 0, 0.55),
          0 0 52px rgba(19, 255, 114, 0.22);
      }

      .brand {
        margin: 0 0 0.95rem;
        font-family: "Bebas Neue", ui-sans-serif, system-ui, sans-serif;
        font-weight: 400;
        font-size: clamp(1.85rem, 7.5vw, 2.85rem);
        letter-spacing: 0.04em;
        line-height: 1;
        text-transform: uppercase;
        text-wrap: balance;
      }

      .brand-accent {
        color: var(--p-accent);
        text-shadow: 0 0 28px rgba(19, 255, 114, 0.35);
      }

      .brand-rest {
        color: var(--p-white);
      }

      .headline {
        margin: 0 0 0.9rem;
        font-family: "Bebas Neue", ui-sans-serif, system-ui, sans-serif;
        font-weight: 400;
        font-size: clamp(1.65rem, 7.2vw, 2.35rem);
        letter-spacing: 0.02em;
        line-height: 1.05;
        text-transform: uppercase;
        text-wrap: balance;
      }

      .support {
        margin: 0 auto 2rem;
        max-width: 24rem;
        color: var(--p-dim);
        font-size: clamp(0.95rem, 3.6vw, 1.0625rem);
        font-weight: 500;
        line-height: 1.55;
        text-wrap: pretty;
      }

      .actions {
        display: grid;
        gap: 0.75rem;
        width: 100%;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.65rem;
        width: 100%;
        min-height: 3.25rem;
        padding: 0.9rem 1.35rem;
        border-radius: 999px;
        border: 1px solid transparent;
        font-family: inherit;
        font-size: 0.8125rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-decoration: none;
        cursor: pointer;
        transition:
          background 0.2s var(--ease-out),
          color 0.2s var(--ease-out),
          border-color 0.2s var(--ease-out),
          transform 0.2s var(--ease-out),
          box-shadow 0.2s var(--ease-out);
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      .btn:focus-visible {
        outline: 2px solid var(--p-accent);
        outline-offset: 3px;
      }

      .btn-primary {
        background: var(--p-accent);
        color: var(--p-on-accent);
        box-shadow: 0 10px 28px rgba(19, 255, 114, 0.28);
      }

      .btn-primary:hover {
        background: var(--p-accent-hover);
        color: var(--p-on-accent);
        box-shadow: 0 12px 32px rgba(255, 255, 255, 0.18);
      }

      .btn-primary:active {
        transform: scale(0.985);
      }

      .btn-secondary {
        background: var(--p-panel);
        color: var(--p-white);
        border-color: var(--p-line);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }

      .btn-secondary:hover {
        border-color: rgba(255, 255, 255, 0.32);
        background: rgba(150, 150, 150, 0.28);
      }

      .btn-secondary:active {
        transform: scale(0.985);
      }

      .btn svg {
        width: 1.15rem;
        height: 1.15rem;
        flex-shrink: 0;
      }

      .footnote {
        margin: 1.75rem 0 0;
        color: rgba(255, 255, 255, 0.42);
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      /* Entrance — restrained, premium */
      .reveal {
        opacity: 0;
        transform: translateY(14px);
        animation: rise 0.7s var(--ease-out) forwards;
      }

      .reveal-1 {
        animation-delay: 0.05s;
      }
      .reveal-2 {
        animation-delay: 0.16s;
      }
      .reveal-3 {
        animation-delay: 0.28s;
      }
      .reveal-4 {
        animation-delay: 0.4s;
      }
      .reveal-5 {
        animation-delay: 0.52s;
      }
      .reveal-6 {
        animation-delay: 0.64s;
      }

      @keyframes rise {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (min-width: 640px) {
        .page {
          padding:
            calc(2.5rem + var(--safe-top))
            calc(2rem + var(--safe-right))
            calc(2.5rem + var(--safe-bottom))
            calc(2rem + var(--safe-left));
        }

        .shell {
          width: min(100%, 30rem);
        }

        .logo-wrap {
          margin-bottom: 2rem;
        }

        .support {
          margin-bottom: 2.25rem;
        }

        .actions {
          gap: 0.85rem;
        }

        .btn {
          min-height: 3.4rem;
          font-size: 0.84375rem;
        }
      }

      @media (min-width: 1024px) {
        .shell {
          width: min(100%, 32rem);
        }

        .logo {
          width: 17.5rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .reveal {
          opacity: 1;
          transform: none;
          animation: none;
        }

        .btn,
        .btn-primary,
        .btn-secondary {
          transition: none;
        }

        .btn:active {
          transform: none;
        }
      }
    </style>
  </head>
